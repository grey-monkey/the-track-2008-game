  <style>
    html {
      background: #172034;
      color-scheme: dark;
    }

    body {
      margin: 0;
    }

    main {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      /* Fallbacks for older browsers; the last supported value is used. */
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      /* Keep every part of the poster clear of notches and the home indicator. */
      padding: env(safe-area-inset-top, 0px)
               env(safe-area-inset-right, 0px)
               env(safe-area-inset-bottom, 0px)
               env(safe-area-inset-left, 0px);
    }

    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <main>
    <img
      src="the%20track%20poster.jpg"
      width="853"
      height="1280"
      alt="The Track: 2008. Cruising in this October. Illustrated poster of a skateboarder being towed behind a black sedan through an unfinished neighborhood at sunset."
      fetchpriority="high"
      loading="eager"
    >
  </main>
</body>
